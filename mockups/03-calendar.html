<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mockup 03 — Calendar view</title>
<style>
  :root {
    --bg: #0f1419;
    --card: #1a2027;
    --card-2: #232b35;
    --text: #e8edf2;
    --muted: #8b95a3;
    --accent: #2ecc71;
    --accent-dim: #1e6e3f;
    --border: #2a3340;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    max-width: 480px;
    margin: 0 auto;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0 20px;
  }
  .back { color: var(--muted); text-decoration: none; font-size: 14px; }
  .month-nav {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
  }
  .month-nav h1 { margin: 0; font-size: 22px; }
  .month-nav .nav-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px; height: 36px;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
  }
  .totals-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
    display: flex; justify-content: space-between;
  }
  .totals-card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  .totals-card .value { font-size: 22px; font-weight: 600; color: var(--accent); margin-top: 2px; }
  .totals-card .proj .value { color: var(--muted); }

  .cal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
  }
  .dow {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 4px; margin-bottom: 6px;
  }
  .dow span {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .days {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .day {
    aspect-ratio: 1 / 1.2;
    border-radius: 8px;
    background: var(--card-2);
    padding: 6px 4px 4px;
    position: relative;
    display: flex; flex-direction: column;
    justify-content: space-between;
  }
  .day .num { font-size: 13px; color: var(--text); }
  .day.dim { background: transparent; }
  .day.dim .num { color: #424c58; }
  .day.today { outline: 2px solid var(--accent); }
  .pay-pill {
    background: var(--accent);
    color: #0a0f15;
    font-size: 10px;
    font-weight: 600;
    padding: 3px 5px;
    border-radius: 5px;
    text-align: center;
    line-height: 1.2;
  }
  .pay-pill.proj {
    background: transparent;
    border: 1px dashed var(--accent-dim);
    color: var(--accent-dim);
  }
  .legend {
    display: flex; gap: 16px; justify-content: center;
    margin-top: 14px;
    font-size: 12px;
    color: var(--muted);
  }
  .legend .sw {
    display: inline-block; width: 12px; height: 12px;
    border-radius: 3px; margin-right: 6px; vertical-align: middle;
  }
  .legend .sw.r { background: var(--accent); }
  .legend .sw.p { border: 1px dashed var(--accent-dim); }
</style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="index.html">‹ All mockups</a>
    <span style="color:var(--muted);font-size:13px;">03 · Calendar</span>
  </div>

  <div class="month-nav">
    <button class="nav-btn">‹</button>
    <h1>May 2026</h1>
    <button class="nav-btn">›</button>
  </div>

  <div class="totals-card">
    <div>
      <div class="label">Received</div>
      <div class="value">$2,693.33</div>
    </div>
    <div class="proj" style="text-align:right;">
      <div class="label">Projected total</div>
      <div class="value">$4,039.50</div>
    </div>
  </div>

  <div class="cal">
    <div class="dow">
      <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span>
      <span>Thu</span><span>Fri</span><span>Sat</span>
    </div>
    <div class="days">
      <!-- Week 1 -->
      <div class="day dim"><span class="num">26</span></div>
      <div class="day dim"><span class="num">27</span></div>
      <div class="day dim"><span class="num">28</span></div>
      <div class="day dim"><span class="num">29</span></div>
      <div class="day dim"><span class="num">30</span></div>
      <div class="day">
        <span class="num">1</span>
        <div class="pay-pill">+$1,347</div>
      </div>
      <div class="day"><span class="num">2</span></div>

      <!-- Week 2 -->
      <div class="day"><span class="num">3</span></div>
      <div class="day"><span class="num">4</span></div>
      <div class="day"><span class="num">5</span></div>
      <div class="day"><span class="num">6</span></div>
      <div class="day"><span class="num">7</span></div>
      <div class="day"><span class="num">8</span></div>
      <div class="day"><span class="num">9</span></div>

      <!-- Week 3 -->
      <div class="day"><span class="num">10</span></div>
      <div class="day"><span class="num">11</span></div>
      <div class="day"><span class="num">12</span></div>
      <div class="day"><span class="num">13</span></div>
      <div class="day"><span class="num">14</span></div>
      <div class="day">
        <span class="num">15</span>
        <div class="pay-pill">+$1,346</div>
      </div>
      <div class="day"><span class="num">16</span></div>

      <!-- Week 4 -->
      <div class="day"><span class="num">17</span></div>
      <div class="day"><span class="num">18</span></div>
      <div class="day"><span class="num">19</span></div>
      <div class="day"><span class="num">20</span></div>
      <div class="day"><span class="num">21</span></div>
      <div class="day"><span class="num">22</span></div>
      <div class="day"><span class="num">23</span></div>

      <!-- Week 5 -->
      <div class="day"><span class="num">24</span></div>
      <div class="day"><span class="num">25</span></div>
      <div class="day today"><span class="num">26</span></div>
      <div class="day"><span class="num">27</span></div>
      <div class="day"><span class="num">28</span></div>
      <div class="day">
        <span class="num">29</span>
        <div class="pay-pill proj">+$1,346</div>
      </div>
      <div class="day"><span class="num">30</span></div>

      <!-- Week 6 -->
      <div class="day"><span class="num">31</span></div>
      <div class="day dim"><span class="num">1</span></div>
      <div class="day dim"><span class="num">2</span></div>
      <div class="day dim"><span class="num">3</span></div>
      <div class="day dim"><span class="num">4</span></div>
      <div class="day dim"><span class="num">5</span></div>
      <div class="day dim"><span class="num">6</span></div>
    </div>

    <div class="legend">
      <span><span class="sw r"></span>Received</span>
      <span><span class="sw p"></span>Projected</span>
    </div>
  </div>
</body>
</html>
